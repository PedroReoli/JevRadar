[package]
name = "jevradar"
version = "0.2.0-alpha.13"
description = "Core local do JevRadar"
authors = ["Pedro Lucas Reis"]
edition = "2024"
license = "Apache-2.0"

[lib]
name = "jevradar_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
chrono = { version = "0.4.42", features = ["serde"] }
csv = "1.4.0"
axum = "0.8.9"
feed-rs = "3.0.0"
keyring = "4.2.0"
parking_lot = "0.12.5"
reqwest = { version = "0.12.24", default-features = false, features = ["blocking", "json", "rustls-tls"] }
rusqlite = { version = "0.41.1", features = ["backup", "bundled", "chrono", "uuid"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.145"
sha2 = "0.10.9"
tauri = { version = "2.12.5", features = ["tray-icon"] }
tauri-plugin-autostart = "2.7.0"
tauri-plugin-notification = "2.8.0"
tokio = { version = "1.48.0", features = ["net", "rt-multi-thread", "sync"] }
utoipa = "6.0.0"
utoipa-swagger-ui = { version = "10.0.2", features = ["axum", "vendored"] }
uuid = { version = "1.29.0", features = ["v4"] }
thiserror = "2.0.17"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }
tauri-plugin-updater = "2.10.0"

[dev-dependencies]
tempfile = "3.23.0"
