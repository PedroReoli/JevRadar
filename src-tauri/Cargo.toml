[package]
name = "jevradar"
version = "0.1.0"
description = "Core local do JevRadar"
authors = ["Pedro Lucas Reis"]
edition = "2024"
license = "Apache-2.0"

[lib]
name = "jevradar_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
parking_lot = "0.12.5"
rusqlite = { version = "0.41.1", features = ["bundled", "chrono", "uuid"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.145"
tauri = { version = "2.12.5", features = ["tray-icon"] }
thiserror = "2.0.17"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }

[dev-dependencies]
tempfile = "3.23.0"
